<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kid Paddle Runner - réalisé par Nathan</title>
  <style>
    :root {
      --bg: #12172b;
      --panel: #202b58;
      --accent: #ffd84d;
      --text: #f7fbff;
      --danger: #ff5a66;
      --ok: #60f2a8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 0%, #31448d 0%, var(--bg) 48%, #070913 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    #gameShell {
      width: min(100vw - 20px, 1160px);
      position: relative;
      user-select: none;
    }

    #canvasWrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 5px solid #10142b;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .45), inset 0 0 0 3px rgba(255,255,255,.12);
      background: #10142b;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: auto;
      cursor: crosshair;
    }

    .centerOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
      padding: 22px;
    }

    #startHint .bubble,
    #gameOver .bubble {
      max-width: 760px;
      padding: clamp(16px, 3vw, 34px);
      border-radius: 24px;
      border: 4px solid rgba(255, 255, 255, .92);
      color: #fff;
      text-shadow: 0 3px 0 rgba(0, 0, 0, .35);
      background: linear-gradient(135deg, rgba(25,33,85,.88), rgba(111,48,149,.82));
      box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 0 40px rgba(255, 221, 85, .12);
    }

    #startHint h1,
    #gameOver h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 5vw, 56px);
      letter-spacing: 1px;
    }

    #startHint h1 {
      font-size: clamp(44px, 8.5vw, 96px);
      line-height: .9;
      color: #ffe768;
      -webkit-text-stroke: 3px rgba(14, 18, 43, .85);
      text-transform: uppercase;
      text-shadow: 0 5px 0 rgba(0,0,0,.38), 0 0 22px rgba(255,232,104,.42);
      animation: titlePulse 1.15s ease-in-out infinite alternate;
    }

    @keyframes titlePulse {
      from { transform: scale(1); filter: saturate(1); }
      to { transform: scale(1.035); filter: saturate(1.25); }
    }

    #startHint .credit {
      margin-top: 2px;
      font-size: clamp(17px, 3vw, 31px);
      color: #9dfbff;
      font-weight: 950;
    }

    #startHint p,
    #gameOver p {
      margin: 8px 0 0;
      font-size: clamp(16px, 2.5vw, 24px);
      font-weight: 800;
    }

    #gameOver {
      display: none;
      pointer-events: auto;
      background: rgba(6, 8, 18, .45);
    }

    #restartOverlayBtn {
      margin-top: 20px;
      border: 0;
      border-radius: 999px;
      padding: 14px 28px;
      background: linear-gradient(#ffe885, #ffb82e);
      color: #271700;
      font-weight: 950;
      font-size: 18px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 0 #9d5b00, 0 12px 20px rgba(0,0,0,.35);
    }

    #restartOverlayBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9d5b00; }

    #toast {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      padding: 9px 14px;
      border-radius: 999px;
      color: white;
      background: rgba(0,0,0,.72);
      font-size: 13px;
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show { opacity: 1; }

    #touchControls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .touchBtn {
      border: 0;
      border-radius: 16px;
      padding: 14px 8px;
      background: linear-gradient(#384da0, #1e2b65);
      color: #fff;
      font-weight: 900;
      font-size: clamp(14px, 2.2vw, 18px);
      letter-spacing: .2px;
      box-shadow: 0 6px 0 #10183d, inset 0 2px 0 rgba(255,255,255,.22);
      text-shadow: 0 2px 0 rgba(0,0,0,.3);
      touch-action: none;
    }

    .touchBtn:active,
    .touchBtn.active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #10183d, inset 0 2px 0 rgba(255,255,255,.18);
      filter: brightness(1.14);
    }

    @media (min-width: 900px) {
      #touchControls { display: none; }
    }

    @media (max-height: 620px) and (orientation: landscape) {
      body { padding: 6px; align-items: flex-start; }
      #gameShell { width: min(100vw - 12px, 1120px); }
      #touchControls { margin-top: 6px; gap: 6px; }
      .touchBtn { padding: 9px 6px; border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main id="gameShell" aria-label="Jeu Kid Paddle Runner">
    <div id="canvasWrap">
      <canvas id="gameCanvas" width="960" height="540"></canvas>
      <div id="startHint" class="centerOverlay">
        <div class="bubble">
          <h1>Kid Paddle Runner</h1>
          <p class="credit">réalisé par Nathan</p>
          <p>Clique ou appuie sur une touche pour démarrer</p>
        </div>
      </div>
      <div id="gameOver" class="centerOverlay">
        <div class="bubble">
          <h1>Game Over</h1>
          <p id="finalScore">Score final : 0</p>
          <button id="restartOverlayBtn" type="button">Redémarrer</button>
          <p style="font-size:14px; opacity:.9; margin-top:12px;">Entrée redémarre aussi la partie</p>
        </div>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>

    <nav id="touchControls" aria-label="Commandes tactiles">
      <button class="touchBtn" id="btnJump" type="button">Sauter</button>
      <button class="touchBtn" id="btnDuck" type="button">Baisser</button>
      <button class="touchBtn" id="btnShoot" type="button">Tirer</button>
      <button class="touchBtn" id="btnRestart" type="button">Rejouer</button>
    </nav>
  </main>

  <script>
  (() => {
    'use strict';

    // ============================================================
    // Kid Paddle Runner - jeu HTML5 autonome en Canvas 2D.
    // Tous les graphismes sont dessinés en Canvas : aucune image,
    // aucune dépendance, aucune requête externe.
    // ============================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const shell = document.getElementById('gameShell');
    const startHint = document.getElementById('startHint');
    const gameOverLayer = document.getElementById('gameOver');
    const finalScoreEl = document.getElementById('finalScore');
    const toastEl = document.getElementById('toast');

    const W = 960;
    const H = 540;
    const GROUND_Y = 452;
    const MAX_AMMO = 20;
    const STORAGE_KEY = 'kid-paddle-runner-best-score-v1';

    const KEY = {
      SPACE: 'Space', UP: 'ArrowUp', DOWN: 'ArrowDown', F: 'KeyF', CTRL: 'ControlLeft', CTRL_R: 'ControlRight',
      P: 'KeyP', M: 'KeyM', ENTER: 'Enter'
    };

    const rnd = (min, max) => min + Math.random() * (max - min);
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const rectsOverlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

    let dpr = 1;
    let lastFrame = performance.now();
    let fullscreenButtonRect = { x: 878, y: 15, w: 56, h: 46 };
    let toastTimer = 0;

    const game = {
      state: 'waiting',
      score: 0,
      best: Number(localStorage.getItem(STORAGE_KEY) || 0),
      lives: 3,
      yogurts: 0,
      ammo: MAX_AMMO,
      nextBossAt: 500,
      bossLevel: 0,
      mode: 'normal',
      previousMode: 'normal',
      spawnTimer: 1.1,
      bonusTimer: 2.5,
      shake: 0,
      flash: 0,
      preBossAmmo: MAX_AMMO,
      muted: false
    };

    const player = {
      x: 136,
      y: GROUND_Y - 78,
      w: 56,
      h: 78,
      crouchH: 43,
      vy: 0,
      gravity: 2200,
      jumpPower: 760,
      onGround: true,
      crouching: false,
      shootCooldown: 0,
      invulnerable: 0,
      blink: 0,
      runTime: 0,
      stepDust: 0
    };

    const bullets = [];
    const enemies = [];
    const bonuses = [];
    const bossProjectiles = [];
    const particles = [];
    let boss = null;

    const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: rnd(80, 335), r: rnd(.5, 2.2), p: rnd(.15, 1) }));
    const skyline = Array.from({ length: 24 }, (_, i) => ({ x: i * 58, w: rnd(32, 70), h: rnd(38, 140), lit: Math.random() > .5 }));
    const hills = Array.from({ length: 10 }, (_, i) => ({ x: i * 145, y: rnd(315, 370), r: rnd(95, 180) }));

    const audio = {
      ctx: null,
      musicTimer: 0,
      step: 0,
      melody: [196, 247, 262, 330, 294, 262, 247, 196, 220, 262, 330, 392, 330, 294, 247, 220],
      bass: [98, 98, 123, 123, 131, 131, 110, 110]
    };

    function resizeCanvas() {
      dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      render();
    }

    window.addEventListener('resize', resizeCanvas, { passive: true });
    document.addEventListener('fullscreenchange', resizeCanvas);
    resizeCanvas();

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      toastTimer = 2.2;
    }

    function ensureAudio() {
      if (game.muted) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!audio.ctx) audio.ctx = new AudioContext();
      if (audio.ctx.state === 'suspended') {
        audio.ctx.resume().catch(() => {});
      }
    }

    function playTone(freq, duration, type = 'square', gain = 0.04, slide = 0) {
      if (game.muted || !audio.ctx) return;
      const now = audio.ctx.currentTime;
      const osc = audio.ctx.createOscillator();
      const vol = audio.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), now + duration);
      vol.gain.setValueAtTime(0.0001, now);
      vol.gain.exponentialRampToValueAtTime(gain, now + 0.01);
      vol.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(vol).connect(audio.ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.03);
    }

    function playEffect(name) {
      ensureAudio();
      switch (name) {
        case 'jump':
          playTone(280, .11, 'square', .05, 280);
          break;
        case 'shoot':
          playTone(760, .055, 'square', .035, -180);
          playTone(1180, .035, 'square', .018, -240);
          break;
        case 'hit':
          playTone(150, .16, 'sawtooth', .055, -70);
          break;
        case 'destroy':
          playTone(420, .07, 'square', .045, 220);
          playTone(700, .06, 'square', .035, -160);
          break;
        case 'bonus':
          playTone(650, .07, 'triangle', .045, 130);
          playTone(900, .08, 'triangle', .035, 140);
          break;
        case 'life':
          playTone(520, .08, 'square', .045, 120);
          setTimeout(() => playTone(780, .08, 'square', .04, 120), 65);
          setTimeout(() => playTone(1040, .12, 'square', .035, 100), 130);
          break;
        case 'boss':
          playTone(110, .22, 'sawtooth', .06, 70);
          setTimeout(() => playTone(82, .25, 'sawtooth', .05, 40), 130);
          break;
        case 'mode':
          playTone(320, .06, 'square', .03, 400);
          break;
        case 'empty':
          playTone(130, .04, 'square', .025, -20);
          break;
      }
    }

    function updateMusic(dt) {
      if (game.state !== 'playing' || game.muted) return;
      ensureAudio();
      audio.musicTimer -= dt;
      if (audio.musicTimer > 0) return;
      const fast = game.mode === 'fast';
      const bossBoost = boss ? .82 : 1;
      audio.musicTimer = (fast ? .115 : .165) * bossBoost;
      const note = audio.melody[audio.step % audio.melody.length];
      const harmony = audio.melody[(audio.step + 4) % audio.melody.length] / 2;
      const bass = audio.bass[Math.floor(audio.step / 2) % audio.bass.length];

      // Boucle chiptune vintage plus audible : mélodie carrée, basse triangle et percussion synthétique.
      playTone(note, .085, 'square', fast ? .060 : .050);
      if (audio.step % 4 === 2) playTone(harmony, .10, 'square', .024);
      if (audio.step % 2 === 0) playTone(bass, .12, 'triangle', .038);
      if (audio.step % 4 === 0) playTone(72, .065, 'sine', .055, -22);
      if (audio.step % 8 === 4) playTone(180, .045, 'square', .030, -70);
      audio.step++;
    }

    function resetGame() {
      game.state = 'waiting';
      game.score = 0;
      game.lives = 3;
      game.yogurts = 0;
      game.ammo = MAX_AMMO;
      game.nextBossAt = 500;
      game.bossLevel = 0;
      game.mode = 'normal';
      game.previousMode = 'normal';
      game.spawnTimer = 1;
      game.bonusTimer = 2.5;
      game.shake = 0;
      game.flash = 0;
      game.preBossAmmo = MAX_AMMO;
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.crouching = false;
      player.shootCooldown = 0;
      player.invulnerable = 0;
      player.runTime = 0;
      player.stepDust = 0;
      bullets.length = 0;
      enemies.length = 0;
      bonuses.length = 0;
      bossProjectiles.length = 0;
      particles.length = 0;
      boss = null;
      startHint.style.display = 'flex';
      gameOverLayer.style.display = 'none';
    }

    function startGame() {
      if (game.state === 'playing') return;
      if (game.state === 'gameover') resetGame();
      game.state = 'playing';
      startHint.style.display = 'none';
      gameOverLayer.style.display = 'none';
      ensureAudio();
      audio.musicTimer = 0;
      audio.step = 0;
      // Petit signal de départ pour confirmer que le son est activé après le premier clic/touche.
      playTone(523, .08, 'square', .045, 120);
      setTimeout(() => playTone(659, .08, 'square', .04, 120), 75);
    }

    function endGame() {
      game.state = 'gameover';
      player.crouching = false;
      game.best = Math.max(game.best, Math.floor(game.score));
      localStorage.setItem(STORAGE_KEY, String(game.best));
      finalScoreEl.textContent = `Score final : ${Math.floor(game.score)}`;
      gameOverLayer.style.display = 'flex';
    }

    function getSpeed() {
      return game.mode === 'fast' ? 560 : 370;
    }

    function updateMode() {
      game.mode = Math.floor(game.score / 250) % 2 === 0 ? 'normal' : 'fast';
      if (game.mode !== game.previousMode) {
        game.previousMode = game.mode;
        game.flash = .25;
        playEffect('mode');
      }
    }

    function jump() {
      if (game.state !== 'playing') return;
      if (player.onGround) {
        player.vy = -player.jumpPower;
        player.onGround = false;
        player.crouching = false;
        spawnPuff(player.x + 20, GROUND_Y - 8, 8, '#d9f2ff');
        playEffect('jump');
      }
    }

    function setDuck(active) {
      if (game.state !== 'playing') return;
      player.crouching = Boolean(active && player.onGround);
    }

    function shoot() {
      if (game.state !== 'playing') return;
      if (player.shootCooldown > 0) return;
      const infiniteAmmo = Boolean(boss);
      if (!infiniteAmmo && game.ammo <= 0) {
        player.shootCooldown = .14;
        playEffect('empty');
        return;
      }
      const box = getPlayerBox();
      if (!infiniteAmmo) game.ammo--;
      player.shootCooldown = .18;
      bullets.push({
        x: box.x + box.w - 2,
        y: box.y + box.h * .42,
        w: 18,
        h: 7,
        vx: 820,
        life: 1.35
      });
      spawnPuff(box.x + box.w, box.y + box.h * .45, 4, '#ffe164');
      playEffect('shoot');
    }

    function getPlayerBox() {
      if (player.crouching && player.onGround) {
        return { x: player.x + 5, y: GROUND_Y - player.crouchH + 6, w: 56, h: player.crouchH - 7 };
      }
      return { x: player.x + 12, y: player.y + 9, w: 38, h: player.h - 15 };
    }

    function spawnPuff(x, y, amount, color) {
      for (let i = 0; i < amount; i++) {
        particles.push({
          x, y,
          vx: rnd(-130, 130),
          vy: rnd(-190, 40),
          r: rnd(2, 6),
          color,
          life: rnd(.25, .6),
          maxLife: .6
        });
      }
    }

    function spawnEnemy() {
      const difficulty = 1 + game.score / 1200;
      const roll = Math.random();
      let enemy;
      if (game.score > 120 && roll < .25) {
        enemy = {
          kind: 'flying',
          skin: Math.random() > .5 ? 'bat' : 'skullbat',
          x: W + 60,
          y: GROUND_Y - 92,
          w: 66,
          h: 42,
          hp: 1,
          maxHp: 1,
          armored: false,
          bob: rnd(0, Math.PI * 2)
        };
      } else if (game.score > 200 && roll < .45) {
        enemy = {
          kind: 'armored',
          skin: 'helmet',
          x: W + 64,
          y: GROUND_Y - 68,
          w: 64,
          h: 68,
          hp: 999,
          maxHp: 999,
          armored: true,
          bob: rnd(0, Math.PI * 2)
        };
      } else {
        const hp = Math.random() < clamp(.18 + game.score / 2600, .18, .55) ? Math.ceil(rnd(2, 4 + difficulty * .35)) : 1;
        enemy = {
          kind: 'ground',
          skin: ['slime', 'tooth', 'spike'][Math.floor(Math.random() * 3)],
          x: W + 60,
          y: GROUND_Y - rnd(45, 64),
          w: rnd(48, 68),
          h: rnd(42, 64),
          hp,
          maxHp: hp,
          armored: false,
          bob: rnd(0, Math.PI * 2)
        };
        enemy.y = GROUND_Y - enemy.h;
      }
      enemies.push(enemy);
    }

    function spawnBonus() {
      const capsule = Math.random() < .42;
      bonuses.push({
        type: capsule ? 'ammo' : 'yogurt',
        x: W + 50,
        y: capsule ? rnd(GROUND_Y - 125, GROUND_Y - 76) : rnd(GROUND_Y - 132, GROUND_Y - 62),
        w: capsule ? 34 : 32,
        h: capsule ? 22 : 38,
        phase: rnd(0, Math.PI * 2)
      });
    }

    function spawnBoss() {
      enemies.length = 0;
      bonuses.length = 0;
      bossProjectiles.length = 0;
      const level = game.bossLevel + 1;
      const type = ['blob', 'robot', 'tentacle', 'horned'][(level - 1) % 4];
      const maxHp = 18 + level * 9;
      game.preBossAmmo = game.ammo;
      boss = {
        level,
        type,
        x: W + 210,
        targetX: W - 250,
        y: GROUND_Y - 178,
        w: 190,
        h: 174,
        hp: maxHp,
        maxHp,
        attackTimer: 1.15,
        hurt: 0,
        phase: 0,
        speedFactor: 1 + level * .09
      };
      game.shake = .35;
      playEffect('boss');
    }

    function chooseBossAttack() {
      if (!boss) return;
      const level = boss.level;
      const pool = ['low', 'high'];
      if (level >= 2) pool.push('drone', 'bounce');
      if (level >= 3) pool.push('laser', 'rain');
      if (level >= 4) pool.push('double');
      if (level >= 6) pool.push('laser', 'bounce', 'rain', 'double');
      const attack = pool[Math.floor(Math.random() * pool.length)];
      launchBossAttack(attack);
    }

    function launchBossAttack(attack) {
      const level = boss ? boss.level : 1;
      const speedBoost = 1 + level * .055;
      const startX = boss ? boss.x + 20 : W - 80;
      if (attack === 'low') {
        bossProjectiles.push({ kind: 'low', x: startX, y: GROUND_Y - 30, w: 34, h: 28, vx: -410 * speedBoost, vy: 0, life: 4 });
      } else if (attack === 'high') {
        bossProjectiles.push({ kind: 'high', x: startX, y: GROUND_Y - 88, w: 44, h: 28, vx: -455 * speedBoost, vy: 0, life: 4 });
      } else if (attack === 'drone') {
        bossProjectiles.push({ kind: 'drone', x: startX, y: GROUND_Y - 118, w: 56, h: 38, vx: -350 * speedBoost, vy: 0, life: 5, wave: rnd(0, Math.PI) });
      } else if (attack === 'bounce') {
        bossProjectiles.push({ kind: 'bounce', x: startX, y: GROUND_Y - 138, w: 34, h: 34, vx: -360 * speedBoost, vy: -140, gravity: 1050, bounces: 3, life: 5 });
      } else if (attack === 'laser') {
        bossProjectiles.push({ kind: 'laserWarn', x: 0, y: GROUND_Y - 86, w: W, h: 26, vx: 0, vy: 0, life: .58, active: false });
      } else if (attack === 'rain') {
        for (let i = 0; i < 7 + Math.min(5, level); i++) {
          const targetBand = i % 3 === 0 ? rnd(player.x - 10, player.x + 70) : rnd(250, W - 110);
          bossProjectiles.push({
            kind: 'rainWarn', x: clamp(targetBand, 40, W - 40), y: 80, w: 24, h: 270, vx: 0, vy: 0,
            life: .46 + i * .04, delayDrop: .46 + i * .04, active: false
          });
        }
      } else if (attack === 'double') {
        bossProjectiles.push({ kind: 'low', x: startX, y: GROUND_Y - 30, w: 34, h: 28, vx: -410 * speedBoost, vy: 0, life: 4 });
        bossProjectiles.push({ kind: 'high', x: startX + 165, y: GROUND_Y - 88, w: 44, h: 28, vx: -455 * speedBoost, vy: 0, life: 4 });
      }
    }

    function damagePlayer(source) {
      if (player.invulnerable > 0 || game.state !== 'playing') return;
      game.lives--;
      player.invulnerable = 1.25;
      game.shake = .28;
      playEffect('hit');
      spawnPuff(player.x + 28, player.y + 38, 22, '#ff4d6d');
      if (source && source.removeOnHit !== false) source.dead = true;
      if (game.lives <= 0) endGame();
    }

    function update(dt) {
      dt = Math.min(dt, .033);
      if (toastTimer > 0) {
        toastTimer -= dt;
        if (toastTimer <= 0) toastEl.classList.remove('show');
      }

      updateMusic(dt);
      if (game.state !== 'playing') return;

      game.score += dt * (game.mode === 'fast' ? 18 : 12);
      if (game.score > game.best) {
        game.best = Math.floor(game.score);
        localStorage.setItem(STORAGE_KEY, String(game.best));
      }
      updateMode();

      const speed = getSpeed();
      game.shake = Math.max(0, game.shake - dt);
      game.flash = Math.max(0, game.flash - dt);
      player.shootCooldown = Math.max(0, player.shootCooldown - dt);
      player.invulnerable = Math.max(0, player.invulnerable - dt);
      player.blink += dt * 22;

      if (!boss && game.score >= game.nextBossAt) spawnBoss();

      updatePlayer(dt);
      updateBullets(dt);
      updateParticles(dt);

      if (boss) {
        updateBoss(dt);
      } else {
        updateWorldEntities(dt, speed);
      }

      updateBossProjectiles(dt, speed);
      checkCollisions();
    }

    function updatePlayer(dt) {
      player.vy += player.gravity * dt;
      player.y += player.vy * dt;
      if (player.y >= GROUND_Y - player.h) {
        player.y = GROUND_Y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
        player.crouching = false;
      }

      if (player.onGround && !player.crouching) {
        player.runTime += dt * (game.mode === 'fast' ? 22 : 16);
        player.stepDust -= dt;
        if (game.state === 'playing' && player.stepDust <= 0) {
          spawnPuff(player.x + 9, GROUND_Y - 2, game.mode === 'fast' ? 3 : 2, 'rgba(255,255,255,.70)');
          player.stepDust = game.mode === 'fast' ? .065 : .105;
        }
      } else if (!player.onGround) {
        player.runTime += dt * 5;
        player.stepDust = 0;
      }
    }

    function updateWorldEntities(dt, speed) {
      const difficulty = 1 + game.score / 1500;
      const scroll = speed * dt;

      game.spawnTimer -= dt;
      if (game.spawnTimer <= 0) {
        spawnEnemy();
        game.spawnTimer = rnd(.82, 1.42) / clamp(difficulty, 1, 1.75);
      }

      game.bonusTimer -= dt;
      if (game.bonusTimer <= 0) {
        spawnBonus();
        game.bonusTimer = rnd(3.0, 5.5) / clamp(1 + game.score / 3200, 1, 1.3);
      }

      for (const e of enemies) {
        e.x -= scroll;
        e.bob += dt * 5;
      }
      for (const b of bonuses) {
        b.x -= scroll;
        b.phase += dt * 4;
      }
      removeDeadAndOffscreen(enemies);
      removeDeadAndOffscreen(bonuses);
    }

    function updateBullets(dt) {
      for (const b of bullets) {
        b.x += b.vx * dt;
        b.life -= dt;
      }
      for (let i = bullets.length - 1; i >= 0; i--) {
        if (bullets[i].x > W + 40 || bullets[i].life <= 0 || bullets[i].dead) bullets.splice(i, 1);
      }
    }

    function updateBoss(dt) {
      if (!boss) return;
      boss.phase += dt;
      boss.hurt = Math.max(0, boss.hurt - dt);
      if (boss.x > boss.targetX) {
        boss.x -= 300 * dt;
        if (boss.x < boss.targetX) boss.x = boss.targetX;
        return;
      }
      boss.attackTimer -= dt * boss.speedFactor;
      if (boss.attackTimer <= 0) {
        chooseBossAttack();
        boss.attackTimer = Math.max(.65, rnd(1.25, 1.95) - boss.level * .07);
      }
    }

    function updateBossProjectiles(dt, speed) {
      for (const p of bossProjectiles) {
        p.life -= dt;
        if (p.kind === 'laserWarn') {
          if (p.life <= 0 && !p.active) {
            p.kind = 'laser';
            p.y = GROUND_Y - 86;
            p.h = 26;
            p.life = .48 + (boss ? Math.min(.3, boss.level * .04) : 0);
            p.active = true;
          }
          continue;
        }
        if (p.kind === 'rainWarn') {
          p.delayDrop -= dt;
          if (p.delayDrop <= 0) {
            p.kind = 'rain';
            p.y = -40;
            p.w = 24;
            p.h = 38;
            p.vy = 760 + (boss ? boss.level * 35 : 0);
            p.life = 2.2;
            p.active = true;
          }
          continue;
        }
        if (p.kind === 'rain') {
          p.y += p.vy * dt;
          if (p.y > GROUND_Y + 30) p.dead = true;
        } else if (p.kind === 'bounce') {
          p.vy += (p.gravity || 1000) * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.y + p.h >= GROUND_Y && p.bounces > 0) {
            p.y = GROUND_Y - p.h;
            p.vy = -520 * Math.max(.45, p.bounces / 3);
            p.bounces--;
            spawnPuff(p.x + p.w / 2, GROUND_Y - 4, 6, '#ffba43');
          }
        } else if (p.kind === 'drone') {
          p.wave += dt * 7;
          p.x += p.vx * dt;
          p.y += Math.sin(p.wave) * 70 * dt;
        } else if (p.kind === 'laser') {
          // Laser fixe : la collision est gérée tant qu'il est actif.
        } else {
          p.x += p.vx * dt;
          p.y += (p.vy || 0) * dt;
        }
      }
      for (let i = bossProjectiles.length - 1; i >= 0; i--) {
        const p = bossProjectiles[i];
        if (p.dead || p.life <= 0 || p.x + p.w < -80 || p.y > H + 80) bossProjectiles.splice(i, 1);
      }
    }

    function updateParticles(dt) {
      for (const p of particles) {
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 420 * dt;
        p.vx *= .985;
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].life <= 0) particles.splice(i, 1);
      }
    }

    function removeDeadAndOffscreen(list) {
      for (let i = list.length - 1; i >= 0; i--) {
        const item = list[i];
        if (item.dead || item.x + item.w < -90) list.splice(i, 1);
      }
    }

    function checkCollisions() {
      const pbox = getPlayerBox();

      for (const bullet of bullets) {
        if (boss && !bullet.dead) {
          const bbox = getBossBox();
          if (rectsOverlap(bullet, bbox)) {
            bullet.dead = true;
            boss.hp--;
            boss.hurt = .08;
            spawnPuff(bullet.x + 8, bullet.y, 6, '#fff17a');
            if (boss.hp <= 0) defeatBoss();
          }
        }

        for (const e of enemies) {
          if (bullet.dead || e.dead) continue;
          const ebox = getEnemyBox(e);
          if (rectsOverlap(bullet, ebox)) {
            bullet.dead = true;
            if (e.armored) {
              spawnPuff(bullet.x, bullet.y, 5, '#8ec9ff');
              playEffect('empty');
            } else {
              e.hp--;
              spawnPuff(bullet.x, bullet.y, 7, '#ffef80');
              if (e.hp <= 0) {
                e.dead = true;
                game.score += 10;
                spawnPuff(e.x + e.w / 2, e.y + e.h / 2, 20, '#9cff6d');
                playEffect('destroy');
              }
            }
          }
        }
      }

      for (const e of enemies) {
        if (e.dead) continue;
        if (rectsOverlap(pbox, getEnemyBox(e))) {
          e.dead = true;
          damagePlayer(e);
        }
      }

      for (const b of bonuses) {
        if (b.dead) continue;
        const yFloat = Math.sin(b.phase) * 7;
        const box = { x: b.x, y: b.y + yFloat, w: b.w, h: b.h };
        if (rectsOverlap(pbox, box)) {
          b.dead = true;
          if (b.type === 'ammo') {
            game.ammo = Math.min(MAX_AMMO, game.ammo + 5);
            playEffect('bonus');
          } else {
            game.yogurts++;
            if (game.yogurts >= 5) {
              game.yogurts = 0;
              game.lives++;
              playEffect('life');
            } else {
              playEffect('bonus');
            }
          }
          spawnPuff(b.x + b.w / 2, b.y + b.h / 2, 14, b.type === 'ammo' ? '#55dcff' : '#ff9fd8');
        }
      }

      for (const projectile of bossProjectiles) {
        if (projectile.dead || projectile.kind === 'laserWarn' || projectile.kind === 'rainWarn') continue;
        if (rectsOverlap(pbox, getProjectileBox(projectile))) {
          damagePlayer(projectile);
        }
      }
    }

    function defeatBoss() {
      if (!boss) return;
      spawnPuff(boss.x + boss.w / 2, boss.y + boss.h / 2, 90, '#fff06d');
      spawnPuff(boss.x + boss.w / 2, boss.y + boss.h / 2, 70, '#ff5b7a');
      game.score += 60 + boss.level * 25;
      game.bossLevel = boss.level;
      game.nextBossAt += 500;
      game.ammo = Math.min(MAX_AMMO, game.preBossAmmo + 5);
      boss = null;
      bossProjectiles.length = 0;
      game.shake = .48;
      playEffect('destroy');
    }

    function getEnemyBox(e) {
      if (e.kind === 'flying') return { x: e.x + 8, y: e.y + 8, w: e.w - 16, h: e.h - 10 };
      if (e.kind === 'armored') return { x: e.x + 6, y: e.y + 8, w: e.w - 12, h: e.h - 8 };
      return { x: e.x + 5, y: e.y + 5, w: e.w - 10, h: e.h - 6 };
    }

    function getBossBox() {
      if (!boss) return { x: 0, y: 0, w: 0, h: 0 };
      return { x: boss.x + 18, y: boss.y + 18, w: boss.w - 36, h: boss.h - 28 };
    }

    function getProjectileBox(p) {
      if (p.kind === 'laser') return { x: 0, y: p.y, w: W, h: p.h };
      return { x: p.x, y: p.y, w: p.w, h: p.h };
    }

    function render() {
      ctx.save();
      ctx.clearRect(0, 0, W, H);
      if (game.shake > 0) {
        ctx.translate(rnd(-8, 8) * game.shake * 2, rnd(-5, 5) * game.shake * 2);
      }

      drawBackground();
      drawBonuses();
      drawEnemies();
      drawBoss();
      drawBossProjectiles();
      drawBullets();
      drawPlayer();
      drawParticles();
      drawHud();
      if (game.flash > 0) drawModeFlash();
      ctx.restore();
    }

    function drawBackground() {
      const fast = game.mode === 'fast';
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      if (fast) {
        grad.addColorStop(0, '#32115d');
        grad.addColorStop(.48, '#a72e85');
        grad.addColorStop(1, '#32172a');
      } else {
        grad.addColorStop(0, '#1b6cc7');
        grad.addColorStop(.52, '#58c7d8');
        grad.addColorStop(1, '#163467');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      const speed = getSpeed();
      const t = game.score / 10;
      for (const s of stars) {
        const x = (s.x - t * s.p * (fast ? 2.4 : 1.2)) % W;
        ctx.globalAlpha = fast ? .7 : .45;
        ctx.fillStyle = fast ? '#ffe56f' : '#ffffff';
        ctx.beginPath();
        ctx.arc(x < 0 ? x + W : x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (const h of hills) {
        const x = ((h.x - game.score * (fast ? .42 : .25)) % (W + 160)) - 120;
        ctx.fillStyle = fast ? 'rgba(255,160,62,.20)' : 'rgba(255,255,255,.18)';
        ctx.beginPath();
        ctx.arc(x, h.y, h.r, Math.PI, 0);
        ctx.fill();
      }

      for (const b of skyline) {
        const x = ((b.x - game.score * (fast ? .9 : .55)) % (W + 80)) - 60;
        ctx.fillStyle = fast ? 'rgba(34, 13, 54, .55)' : 'rgba(11, 44, 91, .45)';
        roundRect(x, GROUND_Y - b.h - 46, b.w, b.h + 46, 6, true, false);
        if (b.lit) {
          ctx.fillStyle = fast ? 'rgba(255, 225, 93, .55)' : 'rgba(255, 246, 139, .52)';
          for (let yy = GROUND_Y - b.h - 26; yy < GROUND_Y - 60; yy += 22) {
            ctx.fillRect(x + 9, yy, 9, 8);
            ctx.fillRect(x + b.w - 18, yy, 9, 8);
          }
        }
      }

      ctx.fillStyle = fast ? '#2a1634' : '#173a4c';
      ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
      ctx.fillStyle = fast ? '#ffb53d' : '#a5ff5f';
      ctx.fillRect(0, GROUND_Y, W, 7);
      ctx.fillStyle = fast ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.16)';
      const stripeOffset = (game.score * (fast ? 2.4 : 1.3)) % 44;
      for (let x = -stripeOffset; x < W; x += 44) {
        ctx.fillRect(x, GROUND_Y + 22, 24, 6);
      }
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      ctx.fillRect(0, GROUND_Y + 54, W, 24);
    }

    function drawModeFlash() {
      ctx.save();
      ctx.globalAlpha = game.flash * 1.7;
      ctx.fillStyle = game.mode === 'fast' ? '#ffdf47' : '#68f7ff';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    function drawPlayer() {
      const crouch = player.crouching && player.onGround;
      if (player.invulnerable > 0 && Math.floor(player.blink) % 2 === 0) return;
      ctx.save();
      const x = player.x;
      let y = crouch ? GROUND_Y - player.crouchH : player.y;
      const running = game.state === 'playing' && player.onGround && !crouch;
      const idle = game.state === 'waiting' && !crouch;
      const walkPhase = running ? player.runTime : (idle ? performance.now() / 420 : player.runTime);
      const stride = Math.sin(walkPhase);
      const bounce = running ? Math.abs(stride) * 5 : (idle ? Math.sin(walkPhase) * 1.8 : 0);
      y += bounce;
      if (crouch) ctx.translate(0, 3);

      // Ombre.
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath();
      ctx.ellipse(x + 29, GROUND_Y + 5, crouch ? 36 : 28 + Math.abs(stride) * 2, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Corps arcade-cartoon.
      ctx.fillStyle = '#2f63ff';
      roundRect(x + 8, y + (crouch ? 11 : 32), crouch ? 58 : 42, crouch ? 27 : 38, 12, true, false);
      ctx.fillStyle = '#ffcf34';
      roundRect(x + 15, y + (crouch ? 16 : 39), crouch ? 27 : 24, crouch ? 14 : 18, 6, true, false);
      drawTinySkull(x + 27, y + (crouch ? 23 : 49), .55);

      // Jambes animées : alternance gauche/droite pour donner une vraie marche/course.
      ctx.fillStyle = '#17213d';
      if (!crouch) {
        const legA = Math.sin(walkPhase) * (running ? 13 : idle ? 4 : 0);
        const legB = -legA;
        const liftA = Math.max(0, -Math.sin(walkPhase)) * (running ? 9 : 1);
        const liftB = Math.max(0, Math.sin(walkPhase)) * (running ? 9 : 1);
        roundRect(x + 12 + legA * .35, y + 66 - liftA, 15, 18, 6, true, false);
        roundRect(x + 35 + legB * .35, y + 66 - liftB, 15, 18, 6, true, false);
        ctx.fillStyle = '#ffffff';
        roundRect(x + 5 + legA, y + 76 - liftA, 24, 8, 4, true, false);
        roundRect(x + 34 + legB, y + 76 - liftB, 24, 8, 4, true, false);
      } else {
        roundRect(x + 11, y + 34, 26, 11, 5, true, false);
        roundRect(x + 39, y + 34, 26, 11, 5, true, false);
        ctx.fillStyle = '#ffffff';
        roundRect(x + 6, y + 39, 23, 8, 4, true, false);
        roundRect(x + 35, y + 39, 23, 8, 4, true, false);
      }

      // Tête.
      ctx.fillStyle = '#ffd6a6';
      roundRect(x + 15, y + (crouch ? -2 : 6), 42, 36, 15, true, false);
      ctx.fillStyle = '#f58e2f';
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(x + 17 + i * 8, y + (crouch ? -3 : 5));
        ctx.lineTo(x + 21 + i * 8, y + (crouch ? -16 : -7));
        ctx.lineTo(x + 27 + i * 8, y + (crouch ? -2 : 6));
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#6bd83f';
      roundRect(x + 11, y + (crouch ? -11 : -2), 50, 16, 9, true, false);
      ctx.fillStyle = '#4aaf34';
      roundRect(x + 50, y + (crouch ? -8 : 2), 24, 9, 4, true, false);

      // Visage.
      ctx.fillStyle = '#10152c';
      ctx.fillRect(x + 26, y + (crouch ? 11 : 19), 5, 5);
      ctx.fillRect(x + 45, y + (crouch ? 11 : 19), 5, 5);
      ctx.strokeStyle = '#10152c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x + 39, y + (crouch ? 22 : 30), 7, .1, Math.PI - .1);
      ctx.stroke();

      // Bras et pistolet-jouet, avec léger balancement pendant la marche.
      const armSwing = !crouch ? Math.sin(walkPhase + Math.PI) * (running ? 7 : idle ? 2 : 0) : 0;
      ctx.strokeStyle = '#ffd6a6';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x + 48, y + (crouch ? 21 : 44));
      ctx.lineTo(x + 74, y + (crouch ? 22 : 45) + armSwing);
      ctx.stroke();
      ctx.fillStyle = '#ffef61';
      roundRect(x + 68, y + (crouch ? 15 : 38) + armSwing, 24, 12, 5, true, false);
      ctx.fillStyle = '#ff5c3a';
      ctx.fillRect(x + 89, y + (crouch ? 19 : 42) + armSwing, 8, 4);
      ctx.restore();
    }

    function drawTinySkull(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = '#10152c';
      ctx.beginPath();
      ctx.arc(0, 0, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffcf34';
      ctx.beginPath(); ctx.arc(-4, -2, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -2, 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-5, 5, 10, 3);
      ctx.restore();
    }

    function drawEnemies() {
      for (const e of enemies) {
        if (e.kind === 'flying') drawFlyingMonster(e);
        else if (e.kind === 'armored') drawArmoredMonster(e);
        else drawGroundMonster(e);
      }
    }

    function drawGroundMonster(e) {
      ctx.save();
      const bob = Math.sin(e.bob) * 2;
      ctx.translate(e.x, e.y + bob);
      ctx.fillStyle = e.skin === 'slime' ? '#67dc53' : e.skin === 'tooth' ? '#b66cff' : '#ff6f4d';
      ctx.strokeStyle = '#15192e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(5, e.h - 6);
      ctx.quadraticCurveTo(e.w * .12, 4, e.w * .5, 4);
      ctx.quadraticCurveTo(e.w * .88, 4, e.w - 5, e.h - 6);
      ctx.quadraticCurveTo(e.w * .5, e.h + 5, 5, e.h - 6);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      if (e.skin === 'spike') {
        ctx.fillStyle = '#fff06d';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(10 + i * 13, 7);
          ctx.lineTo(17 + i * 13, -9);
          ctx.lineTo(24 + i * 13, 8);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(e.w * .35, e.h * .38, 9, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.w * .64, e.h * .38, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(e.w * .38, e.h * .4, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.w * .61, e.h * .4, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#141827';
      roundRect(e.w * .26, e.h * .62, e.w * .48, 9, 4, true, false);
      ctx.fillStyle = '#fff';
      if (e.skin === 'tooth') {
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(e.w * .31 + i * 7, e.h * .62);
          ctx.lineTo(e.w * .35 + i * 7, e.h * .78);
          ctx.lineTo(e.w * .39 + i * 7, e.h * .62);
          ctx.closePath();
          ctx.fill();
        }
      }
      if (e.maxHp > 1) drawMiniHp(8, -15, e.w - 16, e.hp / e.maxHp);
      ctx.restore();
    }

    function drawArmoredMonster(e) {
      ctx.save();
      ctx.translate(e.x, e.y + Math.sin(e.bob) * 1.5);
      ctx.fillStyle = '#56657e';
      ctx.strokeStyle = '#11182a';
      ctx.lineWidth = 4;
      roundRect(4, 10, e.w - 8, e.h - 8, 15, true, true);
      ctx.fillStyle = '#8ba1be';
      roundRect(10, 2, e.w - 20, 22, 8, true, true);
      ctx.fillStyle = '#f9fbff';
      ctx.fillRect(19, 22, 12, 10);
      ctx.fillRect(e.w - 31, 22, 12, 10);
      ctx.fillStyle = '#ff3658';
      ctx.fillRect(22, 24, 7, 6);
      ctx.fillRect(e.w - 29, 24, 7, 6);
      ctx.strokeStyle = '#202943';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(15, 45); ctx.lineTo(e.w - 15, 45);
      ctx.stroke();
      ctx.fillStyle = '#ffd84d';
      ctx.fillRect(e.w * .5 - 5, 6, 10, 16);
      ctx.restore();
    }

    function drawFlyingMonster(e) {
      ctx.save();
      const wing = Math.sin(e.bob * 2) * 10;

    function drawBossProjectiles() {
      for (const p of bossProjectiles) {

          ctx.arc(p.x + p.w / 2, p.y + p.h / 2, p.w / 2, 0, Math.PI * 2);

          ctx.fillStyle = '#fff06d';
          ctx.beginPath(); ctx.arc(p.x + 12, p.y + 9, 5, 0, Math.PI * 2); ctx.fill();
        } else if (p.kind === 'high') {
          ctx.fillStyle = '#75f0ff';

          roundRect(p.x, p.y, p.w, p.h, 14, true, true);

          ctx.fillRect(p.x + 6, p.y + 6, p.w - 12, 5);
        } else if (p.kind === 'drone') {
          ctx.fillStyle = '#323f6e';
          ctx.strokeStyle = '#0b0e1c';
          ctx.lineWidth = 3;
          roundRect(p.x, p.y + 8, p.w, p.h - 12, 12, true, true);
          ctx.fillStyle = '#ffea63';
          ctx.beginPath(); ctx.arc(p.x + 18, p.y + 22, 5, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(p.x + 39, p.y + 22, 5, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#d9faff';
          ctx.beginPath(); ctx.moveTo(p.x + 6, p.y + 7); ctx.lineTo(p.x - 10, p.y); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(p.x + p.w - 6, p.y + 7); ctx.lineTo(p.x + p.w + 10, p.y); ctx.stroke();
        } else if (p.kind === 'bounce') {
          ctx.fillStyle = '#ff4fd2';
          ctx.strokeStyle = '#311031';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(p.x + p.w / 2, p.y + p.h / 2, p.w / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(p.x + 12, p.y + 10, 5, 0, Math.PI * 2); ctx.fill();
        } else if (p.kind === 'laserWarn') {
          ctx.globalAlpha = .22 + Math.sin(performance.now() / 45) * .12;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, p.y, W, p.h);
          ctx.globalAlpha = 1;
        } else if (p.kind === 'laser') {
          ctx.globalAlpha = .85;
          ctx.fillStyle = '#ff315b';
          ctx.fillRect(0, p.y, W, p.h);
          ctx.fillStyle = '#fff8b5';
          ctx.fillRect(0, p.y + 8, W, 8);
          ctx.globalAlpha = 1;
        } else if (p.kind === 'rainWarn') {
          ctx.globalAlpha = .35 + Math.sin(performance.now() / 55) * .15;
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 8]);
          ctx.beginPath(); ctx.moveTo(p.x + p.w / 2, 70); ctx.lineTo(p.x + p.w / 2, GROUND_Y); ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        } else if (p.kind === 'rain') {
          ctx.fillStyle = '#92f7ff';
          ctx.strokeStyle = '#0a3758';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(p.x + p.w / 2, p.y);
          ctx.quadraticCurveTo(p.x + p.w, p.y + 18, p.x + p.w / 2, p.y + p.h);
          ctx.quadraticCurveTo(p.x, p.y + 18, p.x + p.w / 2, p.y);
          ctx.fill(); ctx.stroke();
        }
        ctx.restore();
      }
    }

    function drawHudText(label, value, x, y, color) {

    function drawKidHeadIcon(x, y, scale) {

      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(4 + i * 10, 1);
        ctx.lineTo(10 + i * 10, -12);
        ctx.lineTo(18 + i * 10, 3);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#6bd83f';

    function drawFullscreenButton(x, y, w, h) {
      ctx.fillStyle = 'rgba(255,255,255,.12)';
      roundRect(x, y, w, h, 14, true, false);
      ctx.strokeStyle = 'rgba(255,255,255,.72)';
      ctx.lineWidth = 3;
      const p = 13;
      ctx.beginPath();
      ctx.moveTo(x + p, y + 19); ctx.lineTo(x + p, y + p); ctx.lineTo(x + 22, y + p);
      ctx.moveTo(x + w - p, y + 19); ctx.lineTo(x + w - p, y + p); ctx.lineTo(x + w - 22, y + p);
      ctx.moveTo(x + p, y + h - 19); ctx.lineTo(x + p, y + h - p); ctx.lineTo(x + 22, y + h - p);
      ctx.moveTo(x + w - p, y + h - 19); ctx.lineTo(x + w - p, y + h - p); ctx.lineTo(x + w - 22, y + h - p);
      ctx.stroke();
    }

    function roundRect(x, y, w, h, r, fill, stroke) {
      r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    function screenToCanvas(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * W / rect.width,
        y: (clientY - rect.top) * H / rect.height
      };
    }

    function isInsideRect(point, rect) {
      return point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h;
    }

    function handleCanvasAction(point, isTouch) {
      if (isInsideRect(point, fullscreenButtonRect)) {
        toggleFullscreen();
        if (game.state === 'waiting') startGame();
        return;
      }
      if (game.state === 'waiting') startGame();
      if (game.state !== 'playing') return;
      if (!isTouch) return;
      if (point.y > H * .64) {
        setDuck(true);
      } else if (point.x < W * .5) {
        jump();
      } else {
        shoot();
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      const point = screenToCanvas(e.clientX, e.clientY);
      handleCanvasAction(point, false);
    });

    canvas.addEventListener('mouseup', () => setDuck(false));
    canvas.addEventListener('mouseleave', () => setDuck(false));

    const crouchTouches = new Set();

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const point = screenToCanvas(touch.clientX, touch.clientY);
        handleCanvasAction(point, true);
        if (game.state === 'playing' && point.y > H * .64) crouchTouches.add(touch.identifier);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const point = screenToCanvas(touch.clientX, touch.clientY);
        if (point.y > H * .64) crouchTouches.add(touch.identifier);
        else crouchTouches.delete(touch.identifier);
      }
      setDuck(crouchTouches.size > 0);
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) crouchTouches.delete(touch.identifier);
      setDuck(crouchTouches.size > 0);
    }, { passive: false });

    canvas.addEventListener('touchcancel', (e) => {
      for (const touch of e.changedTouches) crouchTouches.delete(touch.identifier);
      setDuck(crouchTouches.size > 0);
    }, { passive: true });

    document.addEventListener('keydown', (e) => {
      const code = e.code;
      if ([KEY.SPACE, KEY.UP, KEY.DOWN].includes(code)) e.preventDefault();

      if (code === KEY.M) {
        game.muted = !game.muted;
        showToast(game.muted ? 'Son coupé' : 'Son réactivé');
        if (!game.muted) ensureAudio();
        return;
      }

      if (code === KEY.P) {
        toggleFullscreen();
        if (game.state === 'waiting') startGame();
        return;
      }

      if (game.state === 'gameover') {
        if (code === KEY.ENTER) {
          resetGame();
          startGame();
        }
        return;
      }

      if (game.state === 'waiting') startGame();

      if (code === KEY.SPACE || code === KEY.UP) jump();
      else if (code === KEY.DOWN) setDuck(true);
      else if (code === KEY.F || code === KEY.CTRL || code === KEY.CTRL_R) shoot();
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === KEY.DOWN) setDuck(false);
    });

    document.getElementById('restartOverlayBtn').addEventListener('click', () => {
      resetGame();
      startGame();
    });

    function bindButton(id, press, release) {
      const btn = document.getElementById(id);
      const activate = (e) => { e.preventDefault(); btn.classList.add('active'); if (game.state === 'waiting') startGame(); press(); };
      const deactivate = (e) => { e.preventDefault(); btn.classList.remove('active'); if (release) release(); };
      btn.addEventListener('pointerdown', activate);
      btn.addEventListener('pointerup', deactivate);
      btn.addEventListener('pointerleave', deactivate);
      btn.addEventListener('pointercancel', deactivate);
    }

    bindButton('btnJump', jump);
    bindButton('btnShoot', shoot);
    bindButton('btnDuck', () => setDuck(true), () => setDuck(false));
    bindButton('btnRestart', () => { resetGame(); startGame(); });

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          const request = shell.requestFullscreen || shell.webkitRequestFullscreen || shell.mozRequestFullScreen || shell.msRequestFullscreen;
          if (request) {
            const result = request.call(shell);
            if (result && typeof result.catch === 'function') await result;
          } else {
            showToast('Plein écran non disponible sur ce navigateur');
          }
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
          if (exit) {
            const result = exit.call(document);
            if (result && typeof result.catch === 'function') await result;
          }
        }
      } catch (err) {
        showToast('Le plein écran a été refusé par le navigateur');
      }
    }

    function loop(now) {
      const dt = (now - lastFrame) / 1000;
      lastFrame = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    // Dessin initial : décor visible, héros immobile, aucun splash.
    resetGame();
    requestAnimationFrame(loop);
  })();
  </script>
